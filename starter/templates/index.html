<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <section class="game-status" aria-label="Game status">
    <p>Time: <span id="timer" aria-live="off">00:00</span></p>
    <p>Hints used: <span id="hints-used">0</span></p>
  </section>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check</button>
    <button id="get-hint">Hint</button>
    <span id="message" role="status" aria-live="polite"></span>
    <form id="score-form" hidden>
      <label for="player-name">Name for the scoreboard:</label>
      <input id="player-name" name="name" type="text" maxlength="20" autocomplete="name">
      <button type="submit">Save</button>
    </form>
  </div>
  <section class="scoreboard" aria-labelledby="scoreboard-heading">
    <h2 id="scoreboard-heading">Top 10 Scores</h2>
    <p id="scoreboard-message" role="status" aria-live="polite"></p>
    <table>
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Name</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
    </table>
  </section>
  <script type="module" src="/static/main.js"></script>
</body>
</html>

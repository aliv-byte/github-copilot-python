<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('sudokuTheme');
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      document.documentElement.dataset.theme =
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <h1>Sudoku Game</h1>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >Dark mode</button>
    </header>
    <section
      id="victory-banner"
      class="victory-banner"
      hidden
      aria-labelledby="victory-heading"
      aria-live="polite"
    >
      <h2 id="victory-heading">Congratulations!</h2>
      <p>
        Time taken: <span id="victory-time"></span>
        &middot; Hints used: <span id="victory-hints"></span>
      </p>
      <form id="score-form" hidden>
        <label for="player-name">Name for the scoreboard:</label>
        <input id="player-name" name="name" type="text" maxlength="20" autocomplete="name">
        <button type="submit">Save</button>
      </form>
    </section>
    <div id="sudoku-board" aria-label="Sudoku board"></div>
    <section class="game-status" aria-label="Game status">
      <p>Time: <span id="timer" aria-live="off">00:00</span></p>
      <p>Hints used: <span id="hints-used">0</span></p>
    </section>
    <div class="controls">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game" type="button">New Game</button>
      <button id="check-solution" type="button">Check</button>
      <button id="get-hint" type="button">Hint</button>
      <span id="message" role="status" aria-live="polite"></span>
    </div>
    <section class="scoreboard" aria-labelledby="scoreboard-heading">
      <h2 id="scoreboard-heading">Top 10 Scores</h2>
      <p id="scoreboard-message" role="status" aria-live="polite"></p>
      <div class="scoreboard-table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Name</th>
              <th scope="col">Time</th>
              <th scope="col">Difficulty</th>
              <th scope="col">Hints</th>
            </tr>
          </thead>
          <tbody id="scoreboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
